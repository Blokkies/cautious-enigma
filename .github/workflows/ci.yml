name: CI

on:
  push:
    branches: [v2]
  pull_request:
    branches: [v2]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgres://build:build@localhost:5432/build
          JWT_SECRET: ci
          ADMIN_PASSWORD: ci
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: 1
